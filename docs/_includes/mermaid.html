<style>
  .main-content pre.mermaid { background: none; border: 0; padding: 0; text-align: center; }
</style>
<script type="module">
  // Kramdown renders ```mermaid fences as code blocks; swap them for mermaid containers.
  const blocks = [
    ...new Set(
      [...document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid")].map(
        (el) => el.closest("div.language-mermaid") ?? el.parentElement,
      ),
    ),
  ];
  if (blocks.length > 0) {
    const { default: mermaid } = await import(
      "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs"
    );
    blocks.forEach((block) => {
      const diagram = document.createElement("pre");
      diagram.className = "mermaid";
      diagram.textContent = block.textContent.trim();
      block.replaceWith(diagram);
    });
    mermaid.initialize({ startOnLoad: false, theme: "neutral", securityLevel: "strict" });
    await mermaid.run({ querySelector: "pre.mermaid" });
  }
</script>
