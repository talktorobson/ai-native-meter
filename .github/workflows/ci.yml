name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: devex demo
      - name: Token economics runs offline on the committed synthetic events
        run: devex spend --by team && devex spend --by task
      - name: Dashboard is generated and committed up to date
        run: devex dashboard && git diff --exit-code -- docs/dashboard.html
      - name: Real-data reports and dashboards run offline from the committed snapshots
        run: |
          devex report --source real --repo microsoft/vscode --repo dotnet/runtime
          devex compare
          devex engineers --repo microsoft/vscode --repo dotnet/runtime
          devex dashboard --source real && git diff --exit-code -- 'docs/dashboard-real*.html'
          test -z "$(git status --porcelain -- docs)"
